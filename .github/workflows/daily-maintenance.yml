name: Daily Maintenance

on:
  schedule:
    # Runs daily at 13:15 UTC
    - cron: '15 13 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  dependency-maintenance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply safe dependency maintenance
        run: |
          npm update
          npm audit fix --package-lock-only || true
          npm dedupe

      - name: Verify production build
        run: npm run build

      - name: Check for meaningful changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create maintenance pull request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: daily dependency maintenance"
          branch: "chore/daily-maintenance"
          delete-branch: true
          title: "chore: daily maintenance updates"
          body: |
            Automated daily maintenance run.

            What this includes:
            - `npm update`
            - `npm audit fix --package-lock-only`
            - `npm dedupe`
            - production build verification (`npm run build`)

            This PR is only created when real file changes are detected.
          labels: |
            dependencies
            maintenance
